---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: unifi-backup
  namespace: unifi
spec:
  sourcePVC: unifi-shelf-ceph
  trigger:
    # Take a backup daily
    schedule: "0 0 * * *"
  restic:
    cacheStorageClassName: ceph-block
    pruneIntervalDays: 14
    repository: unifi-restic-config
    retain:
      daily: 5
      weekly: 4
      monthly: 2
      yearly: 1
    copyMethod: Clone
    moverSecurityContext:
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
