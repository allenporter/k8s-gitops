---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  chart:
    spec:
      # renovate: registryUrl=https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      version: 88.0.1
  values:
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "ceph-block"
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: "ceph-block"
    grafana:
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        hosts:
          - g.k8s.mrv.thebends.org
        tls:
          - secretName: g-tls
            hosts:
              - g.k8s.mrv.thebends.org
