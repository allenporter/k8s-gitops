---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-personal
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "Personal general-purpose workspace for scratchpads, tools, and ad-hoc development."
spec:
  releaseName: ws-personal
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      reconcileStrategy: Revision
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: personal
    global:
      domainSuffix: "${name_service_dns_domain:=k8s.mrv.thebends.org}"
      registry: "registry.k8s.mrv.thebends.org"
      sshKeySecret: "ssh-public-keys"
    features:
      registry.k8s.mrv.thebends.org/devcontainers/antigravity-remote-control:1:
        enableRemoteControl: true
        enableLocalInterface: true
        hostname: "personal"
      ghcr.io/devcontainers/features/sshd:1: {}
    storage:
      size: 30Gi
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "8Gi"
    nodeSelector:
      kubernetes.io/hostname: "kapi03"
    image:
      repository: registry.k8s.mrv.thebends.org/devcontainers/personal
      tag: latest
    builder:
      enabled: true
