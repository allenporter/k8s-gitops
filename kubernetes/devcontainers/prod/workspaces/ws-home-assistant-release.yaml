---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-home-assistant
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "Home Assistant core, frontend, alerts, python-roborock, pyrainbird, aioesphomeapi, nest, ring-keypad, google-health-api, photos, and canvas."
spec:
  releaseName: ws-home-assistant
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      reconcileStrategy: Revision
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: home-assistant
    global:
      domainSuffix: "${name_service_dns_domain:=k8s.mrv.thebends.org}"
      registry: "registry.k8s.mrv.thebends.org"
      sshKeySecret: "ssh-public-keys"
    features:
      registry.k8s.mrv.thebends.org/devcontainers/antigravity-remote-control:1:
        enableRemoteControl: true
        enableLocalInterface: true
        hostname: "home-assistant"
      ghcr.io/devcontainers/features/sshd:1: {}
    git:
      url: https://github.com/home-assistant/core.git
      directory: home-assistant-core
      extraRepos:
        - url: https://github.com/allenporter/home-assistant-frontend.git
          directory: home-assistant-frontend
        - url: https://github.com/allenporter/alerts.home-assistant.io.git
          directory: alerts.home-assistant.io
        - url: https://github.com/allenporter/python-roborock.git
          directory: python-roborock
        - url: https://github.com/allenporter/pyrainbird.git
          directory: pyrainbird
        - url: https://github.com/allenporter/aioesphomeapi.git
          directory: aioesphomeapi
        - url: https://github.com/allenporter/python-google-nest-sdm.git
          directory: python-google-nest-sdm
        - url: https://github.com/allenporter/home-assistant-ring-keypad.git
          directory: home-assistant-ring-keypad
        - url: https://github.com/allenporter/python-google-health-api.git
          directory: python-google-health-api
        - url: https://github.com/allenporter/python-google-photos-library-api.git
          directory: python-google-photos-library-api
        - url: https://github.com/allenporter/home-assistant-canvas.git
          directory: home-assistant-canvas
    storage:
      size: 50Gi
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        memory: "16Gi"
    nodeSelector:
      kubernetes.io/hostname: "kapi03"
    image:
      repository: registry.k8s.mrv.thebends.org/devcontainers/home-assistant-core
      tag: latest
    builder:
      enabled: true
