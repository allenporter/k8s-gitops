---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-calendar
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "Calendar and sync library development: ical, icaldav, and gcal_sync."
spec:
  releaseName: ws-calendar
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      reconcileStrategy: Revision
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: calendar
    global:
      domainSuffix: "${name_service_dns_domain:=k8s.mrv.thebends.org}"
      registry: "registry.k8s.mrv.thebends.org"
      sshKeySecret: "ssh-public-keys"
    features:
      registry.k8s.mrv.thebends.org/devcontainers/antigravity-remote-control:1:
        enableRemoteControl: true
        enableLocalInterface: true
        hostname: "calendar"
      ghcr.io/devcontainers/features/sshd:1: {}
    git:
      url: https://github.com/allenporter/ical.git
      directory: ical
      extraRepos:
        - url: https://github.com/allenporter/icaldav.git
          directory: icaldav
        - url: https://github.com/allenporter/gcal_sync.git
          directory: gcal_sync
    storage:
      size: 20Gi
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "8Gi"
    nodeSelector:
      kubernetes.io/hostname: "kapi03"
    image:
      repository: registry.k8s.mrv.thebends.org/devcontainers/calendar
      tag: latest
    builder:
      enabled: true
      cacheFrom:
        - registry.k8s.mrv.thebends.org/devcontainers/personal:latest
