---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-harness-dev
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "ADK coder harness development, test automation framework, and custom Home Assistant ADK components."
spec:
  releaseName: ws-harness-dev
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      reconcileStrategy: Revision
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: harness-dev
    global:
      domainSuffix: "${name_service_dns_domain:=k8s.mrv.thebends.org}"
      registry: "registry.k8s.mrv.thebends.org"
      sshKeySecret: "ssh-public-keys"
    features:
      registry.k8s.mrv.thebends.org/devcontainers/antigravity:1: {}
      ghcr.io/devcontainers/features/sshd:1: {}
    git:
      url: https://github.com/allenporter/adk-coder.git
      directory: harness-dev
    storage:
      size: 30Gi
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "8Gi"
    nodeSelector:
      kubernetes.io/hostname: "kube01"
    image:
      repository: registry.k8s.mrv.thebends.org/devcontainers/harness-dev
      tag: latest
    builder:
      enabled: true
