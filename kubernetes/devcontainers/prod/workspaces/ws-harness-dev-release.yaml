---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-harness-dev
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "Autonomous AI agent harness development (ADK Coder), agent evaluation benchmarks, and custom Home Assistant ADK integration components."
spec:
  releaseName: ws-harness-dev
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      interval: 30m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 5m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: harness-dev
    git:
      url: https://github.com/allenporter/adk-coder.git
      directory: harness-dev
    storage:
      size: 30Gi
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        memory: "16Gi"
    image:
      tag: latest
    builder:
      enabled: true
