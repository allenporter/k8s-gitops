---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-platform
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "Platform engineering: k8s-gitops, devcontainer-features, and repo-conformance."
spec:
  releaseName: ws-platform
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      reconcileStrategy: Revision
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: platform
    global:
      domainSuffix: "${name_service_dns_domain:=k8s.mrv.thebends.org}"
      registry: "registry.k8s.mrv.thebends.org"
      sshKeySecret: "ssh-public-keys"
    features:
      registry.k8s.mrv.thebends.org/devcontainers/antigravity:1: {}
      ghcr.io/devcontainers/features/sshd:1: {}
    git:
      url: https://github.com/allenporter/k8s-gitops.git
      directory: k8s-gitops
      extraRepos:
        - url: https://github.com/allenporter/devcontainer-features.git
          directory: devcontainer-features
        - url: https://github.com/allenporter/repo-conformance.git
          directory: repo-conformance
    storage:
      size: 30Gi
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        memory: "8Gi"
    nodeSelector:
      kubernetes.io/hostname: "kapi02"
    image:
      repository: registry.k8s.mrv.thebends.org/devcontainers/k8s-gitops
      tag: latest
    builder:
      enabled: true
