---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-journal-notes
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "Personal knowledge management, Journal Assistant processing tools, note automation, and Supernote e-ink device integrations."
spec:
  releaseName: ws-journal-notes
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      interval: 30m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 5m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: journal-notes
    git:
      url: https://github.com/allenporter/journal-assistant.git
      directory: journal-notes
    storage:
      size: 20Gi
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "16Gi"
    image:
      repository: registry.k8s.mrv.thebends.org/devcontainers/home-assistant-core
      tag: latest
    builder:
      enabled: true
