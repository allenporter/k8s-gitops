---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-journal-notes
  namespace: devcontainers
  annotations:
    devcontainer.purpose: "Journal assistant and Supernote document parsing tools."
spec:
  releaseName: ws-journal-notes
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      reconcileStrategy: Revision
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 1m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: journal-notes
    global:
      domainSuffix: "${name_service_dns_domain:=k8s.mrv.thebends.org}"
      registry: "registry.k8s.mrv.thebends.org"
      sshKeySecret: "ssh-public-keys"
    features:
      registry.k8s.mrv.thebends.org/devcontainers/antigravity:1:
        # renovate: datasource=custom.antigravity depName=antigravity
        version: "2.8.1"
      ghcr.io/devcontainers/features/sshd:1: {}
    git:
      url: https://github.com/allenporter/journal-assistant.git
      directory: journal-assistant
      extraRepos:
        - url: https://github.com/allenporter/supernote.git
          directory: supernote
    storage:
      size: 20Gi
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "8Gi"
    nodeSelector:
      kubernetes.io/hostname: "kapi03"
    image:
      repository: registry.k8s.mrv.thebends.org/devcontainers/journal-notes
      tag: latest
    builder:
      enabled: true
