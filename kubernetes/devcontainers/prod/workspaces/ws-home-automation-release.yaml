---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ws-home-automation
  namespace: devcontainers
spec:
  releaseName: ws-home-automation
  chart:
    spec:
      chart: ./kubernetes/devcontainers/charts/devcontainer-workspace
      interval: 30m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 5m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
  values:
    workspaceName: home-automation
    git:
      url: https://github.com/home-assistant/core.git
      directory: home-automation
    storage:
      size: 40Gi
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        memory: "16Gi"
    image:
      tag: latest
    builder:
      enabled: true
