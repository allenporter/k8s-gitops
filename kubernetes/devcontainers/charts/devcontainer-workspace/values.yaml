# Default values for devcontainer-workspace.
# This is a YAML-formatted file.

global:
  registry: registry.k8s.mrv.thebends.org
  domainSuffix: devcontainers.k8s.mrv.thebends.org
  storageClass: local-hostpath
  sshKeySecret: ssh-public-keys
  sshTargetPort: 2222
  builder:
    image: node:24-bookworm-slim
    dindImage: docker:29-dind

workspaceName: ""
git:
  url: ""
  directory: ""
storage:
  size: 20Gi
image:
  repository: ""
  tag: latest
builder:
  enabled: true
  cacheFrom: []

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    memory: "16Gi"

sharedKeyring:
  enabled: true
  claimName: antigravity-shared-keyring-pvc

nodeSelector: {}
tolerations: []
