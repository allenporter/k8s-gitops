# Generic default values for devcontainer-workspace chart.
# Cluster-specific values and feature lists belong in HelmRelease manifests.

global:
  registry: ""
  domainSuffix: ""
  storageClass: local-hostpath
  sshKeySecret: ssh-public-keys
  sshTargetPort: 2222
  builder:
    image: node:24-bookworm-slim
    dindImage: docker:29-dind

ingress:
  className: nginx-internal
  clusterIssuer: letsencrypt

workspaceName: ""
git:
  url: ""
  directory: ""
storage:
  size: 20Gi
backup:
  enabled: false
  schedule: "30 1 * * *"
  repositorySecret: ""
  copyMethod: Direct
  cacheStorageClassName: ceph-block
  pruneIntervalDays: 14
  retain:
    daily: 5
    weekly: 4
    monthly: 2
    yearly: 1
image:
  repository: ""
  tag: latest
builder:
  enabled: true
  cacheFrom: []
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400

features:
  ghcr.io/devcontainers/features/github-cli:1: {}

resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    memory: "8Gi"

sidecarResources:
  limits:
    memory: 32Mi
    cpu: 50m

nodeSelector: {}
tolerations: []
runtimeClassName: ""
env: []

serviceAccount:
  create: false
  name: ""
  clusterAdmin: false
