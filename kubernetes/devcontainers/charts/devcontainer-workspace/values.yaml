# Generic default values for devcontainer-workspace chart.
# Cluster-specific values and feature lists belong in HelmRelease manifests.

global:
  registry: ""
  domainSuffix: ""
  storageClass: local-hostpath
  sshKeySecret: ssh-public-keys
  sshTargetPort: 2222
  builder:
    image: node:24-bookworm-slim
    dindImage: docker:29-dind

ingress:
  className: nginx-internal
  clusterIssuer: letsencrypt

workspaceName: ""
git:
  url: ""
  directory: ""
storage:
  size: 20Gi
image:
  repository: ""
  tag: latest
builder:
  enabled: true
  cacheFrom: []

features: {}

resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    memory: "8Gi"

nodeSelector: {}
tolerations: []

serviceAccount:
  create: false
  name: ""
  clusterAdmin: false
