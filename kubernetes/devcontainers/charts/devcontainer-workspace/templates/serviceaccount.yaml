{{- if or .Values.serviceAccount.create .Values.serviceAccount.name -}}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (printf "sa-%s" .Values.workspaceName) }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.serviceAccount.clusterAdmin }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccount.name | default (printf "sa-%s" .Values.workspaceName) }}-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name | default (printf "sa-%s" .Values.workspaceName) }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
