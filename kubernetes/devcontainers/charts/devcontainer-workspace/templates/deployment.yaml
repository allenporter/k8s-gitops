---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-{{ .Values.workspaceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: ws-{{ .Values.workspaceName }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ws-{{ .Values.workspaceName }}
  template:
    metadata:
      labels:
        app: ws-{{ .Values.workspaceName }}
    spec:
      containers:
      - name: workspace
        image: "{{ if .Values.image.repository }}{{ .Values.image.repository }}{{ else }}{{ .Values.global.registry }}/devcontainers/{{ .Values.git.directory }}{{ end }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        workingDir: /workspaces/{{ .Values.git.directory }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        command: ["/bin/sh", "-c"]
        args:
        - |
            if [ -x /usr/local/bin/start-antigravity ] && ! pgrep -f language_server >/dev/null 2>&1; then
              /usr/local/bin/start-antigravity >/dev/null 2>&1 &
            fi

            if ! command -v sshd >/dev/null 2>&1; then
              echo "sshd not found. Installing openssh-server..."
              sudo apt-get update && sudo apt-get install -y openssh-server
            fi
            sudo mkdir -p /home/vscode/.ssh
            sudo cp /tmp/ssh-keys/authorized_keys /home/vscode/.ssh/authorized_keys
            sudo chown -R vscode:vscode /home/vscode/.ssh
            sudo chmod 700 /home/vscode/.ssh
            sudo chmod 600 /home/vscode/.ssh/authorized_keys
            sudo ssh-keygen -A
            sudo mkdir -p /var/run/sshd
            (sudo chown -R vscode:vscode /workspaces /home/vscode/.local/share/keyrings || true) &

            sudo /usr/sbin/sshd -D -p {{ .Values.global.sshTargetPort }}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                (
                  if [ ! -d /workspaces/{{ .Values.git.directory }}/.git ]; then
                    echo "Cloning primary repo..."
                    git clone {{ .Values.git.url }} /workspaces/{{ .Values.git.directory }}
                    chown -R vscode:vscode /workspaces/{{ .Values.git.directory }} || true
                  fi
                  {{- range .Values.git.extraRepos }}
                  if [ ! -d /workspaces/{{ .directory }}/.git ]; then
                    echo "Cloning {{ .directory }}..."
                    git clone {{ .url }} /workspaces/{{ .directory }}
                    chown -R vscode:vscode /workspaces/{{ .directory }} || true
                  fi
                  {{- end }}
                ) >/tmp/workspace-clone.log 2>&1 &
        volumeMounts:
        - name: workspace-volume
          mountPath: /workspaces
        - name: ssh-keys
          mountPath: /tmp/ssh-keys
          readOnly: true
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
      - name: workspace-volume
        persistentVolumeClaim:
          claimName: ws-{{ .Values.workspaceName }}-pvc
      - name: ssh-keys
        secret:
          secretName: {{ .Values.global.sshKeySecret | quote }}
          defaultMode: 0o600
