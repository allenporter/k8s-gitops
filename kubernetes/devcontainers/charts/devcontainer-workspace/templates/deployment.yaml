---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-{{ .Values.workspaceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: ws-{{ .Values.workspaceName }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ws-{{ .Values.workspaceName }}
  template:
    metadata:
      labels:
        app: ws-{{ .Values.workspaceName }}
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: init-git-repos
        image: alpine/git:latest
        command:
        - sh
        - -c
        - |
          mkdir -p /workspaces/.persistent/keyrings /workspaces/.persistent/antigravity
          if [ ! -d /workspaces/{{ .Values.git.directory }}/.git ]; then
            echo "Cloning primary repo {{ .Values.git.directory }}..."
            git clone {{ .Values.git.url }} /workspaces/{{ .Values.git.directory }}
          fi
          {{- range .Values.git.extraRepos }}
          if [ ! -d /workspaces/{{ .directory }}/.git ]; then
            echo "Cloning extra repo {{ .directory }}..."
            git clone {{ .url }} /workspaces/{{ .directory }}
          fi
          {{- end }}
        volumeMounts:
        - name: workspace-volume
          mountPath: /workspaces
      containers:
      - name: workspace
        image: "{{ if .Values.image.repository }}{{ .Values.image.repository }}{{ else }}{{ .Values.global.registry }}/devcontainers/{{ .Values.git.directory }}{{ end }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        workingDir: /workspaces
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        command: ["/bin/sh", "-c"]
        args:
        - |
            if [ -x /usr/local/bin/start-antigravity ]; then
              /usr/local/bin/start-antigravity >/tmp/start-antigravity.log 2>&1 &
            fi
            sleep infinity
        volumeMounts:
        - name: workspace-volume
          mountPath: /workspaces
        - name: workspace-volume
          subPath: .persistent/keyrings
          mountPath: /home/vscode/.local/share/keyrings
        - name: workspace-volume
          subPath: .persistent/antigravity
          mountPath: /home/vscode/.gemini/antigravity
      - name: ingress-bridge-sidecar
        image: alpine/socat:latest
        command:
        - socat
        - "TCP-LISTEN:43635,fork,bind=0.0.0.0,reuseaddr"
        - "TCP:127.0.0.1:52424"
        resources:
          limits:
            memory: 32Mi
            cpu: 50m
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
      - name: workspace-volume
        persistentVolumeClaim:
          claimName: ws-{{ .Values.workspaceName }}-pvc
