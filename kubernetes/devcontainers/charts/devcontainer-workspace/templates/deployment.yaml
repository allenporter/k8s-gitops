---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-{{ .Values.workspaceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: ws-{{ .Values.workspaceName }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ws-{{ .Values.workspaceName }}
  template:
    metadata:
      labels:
        app: ws-{{ .Values.workspaceName }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "sa-%s" .Values.workspaceName) }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      # Standard DevContainer non-root user (vscode: UID 1000, GID 1000)
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: Always
      initContainers:
      - name: init-git-repos
        image: alpine/git:latest
        command:
        - sh
        - -c
        - |
          {{- if and .Values.git.url .Values.git.directory }}
          if [ ! -d /workspaces/{{ .Values.git.directory }}/.git ]; then
            echo "Cloning primary repo {{ .Values.git.directory }}..."
            git clone {{ .Values.git.url }} /workspaces/{{ .Values.git.directory }}
          fi
          {{- end }}
          {{- range .Values.git.extraRepos }}
          if [ ! -d /workspaces/{{ .directory }}/.git ]; then
            echo "Cloning extra repo {{ .directory }}..."
            git clone {{ .url }} /workspaces/{{ .directory }}
          fi
          {{- end }}
        volumeMounts:
        - name: workspace-volume
          mountPath: /workspaces
      containers:
      - name: workspace
        image: "{{ if .Values.image.repository }}{{ .Values.image.repository }}{{ else }}{{ .Values.global.registry }}/devcontainers/{{ .Values.git.directory | default .Values.workspaceName }}{{ end }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        workingDir: /workspaces
        {{- $rcOpts := dict -}}
        {{- range $featKey, $featVal := (.Values.features | default dict) -}}
          {{- if and (contains "antigravity-remote-control" $featKey) (kindIs "map" $featVal) -}}
            {{- $rcOpts = $featVal -}}
          {{- end -}}
        {{- end -}}
        {{- $rcEnv := list -}}
        {{- if hasKey $rcOpts "enableRemoteControl" -}}
          {{- $rcEnv = append $rcEnv (dict "name" "ANTIGRAVITY_ENABLE_REMOTE_CONTROL" "value" (printf "%v" $rcOpts.enableRemoteControl)) -}}
        {{- end -}}
        {{- if hasKey $rcOpts "enableLocalInterface" -}}
          {{- $rcEnv = append $rcEnv (dict "name" "ANTIGRAVITY_ENABLE_LOCAL_INTERFACE" "value" (printf "%v" $rcOpts.enableLocalInterface)) -}}
        {{- end -}}
        {{- if and (hasKey $rcOpts "hostname") $rcOpts.hostname -}}
          {{- $rcEnv = append $rcEnv (dict "name" "ANTIGRAVITY_HOSTNAME" "value" (printf "%v" $rcOpts.hostname)) -}}
        {{- end -}}
        {{- $allEnv := concat $rcEnv (.Values.env | default list) -}}
        {{- if $allEnv }}
        env:
          {{- toYaml $allEnv | nindent 10 }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        command: ["/bin/sh", "-c"]
        args:
        - |
            mkdir -p /workspaces/.persistent/config /workspaces/.persistent/gemini /workspaces/.persistent/keyrings /workspaces/.persistent/bin
            ln -sfn /workspaces/.persistent /workspaces/.persistent_vscode
            {{- if .Values.serviceAccount.clusterAdmin }}
            if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
              mkdir -p /home/vscode/.kube
              cat <<'EOF' > /home/vscode/.kube/config
            apiVersion: v1
            kind: Config
            clusters:
            - name: in-cluster
              cluster:
                server: https://kubernetes.default.svc:443
                certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            contexts:
            - name: in-cluster
              context:
                cluster: in-cluster
                user: serviceaccount
                namespace: default
            current-context: in-cluster
            users:
            - name: serviceaccount
              user:
                tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            EOF
              chmod 600 /home/vscode/.kube/config
            fi
            {{- end }}
            if [ -s /home/vscode/.gemini/config/config.json ] && command -v jq >/dev/null 2>&1 && [ -n "${ANTIGRAVITY_ENABLE_REMOTE_CONTROL:-}${ANTIGRAVITY_HOSTNAME:-}" ]; then
              rc_bool="true"
              case "$(printf '%s' "${ANTIGRAVITY_ENABLE_REMOTE_CONTROL:-true}" | tr '[:upper:]' '[:lower:]')" in
                false|0|no|off) rc_bool="false" ;;
              esac
              if jq empty /home/vscode/.gemini/config/config.json >/dev/null 2>&1; then
                tmp_cfg=$(mktemp)
                jq --argjson rc_enabled "${rc_bool}" --arg rc_host "${ANTIGRAVITY_HOSTNAME:-}" '
                  .userSettings = (.userSettings // {}) |
                  .userSettings.remoteControlEnabled = $rc_enabled |
                  if ($rc_host | length) > 0 then
                    .userSettings.remoteControlHostname = $rc_host |
                    .userSettings.cliRemoteControlHostname = $rc_host
                  else . end
                ' /home/vscode/.gemini/config/config.json > "${tmp_cfg}" && chmod 600 "${tmp_cfg}" && mv -f "${tmp_cfg}" /home/vscode/.gemini/config/config.json || rm -f "${tmp_cfg}"
              fi
            fi
            if [ -x /workspaces/.persistent/bin/start-antigravity ]; then
              /workspaces/.persistent/bin/start-antigravity >/tmp/start-antigravity.log 2>&1 &
            elif [ -x /usr/local/bin/start-antigravity ]; then
              /usr/local/bin/start-antigravity >/tmp/start-antigravity.log 2>&1 &
            fi
            sleep infinity
        volumeMounts:
        - name: workspace-volume
          mountPath: /workspaces
        - name: workspace-volume
          subPath: .persistent/keyrings
          mountPath: /home/vscode/.local/share/keyrings
        - name: workspace-volume
          subPath: .persistent/gemini
          mountPath: /home/vscode/.gemini
        - name: workspace-volume
          subPath: .persistent/config
          mountPath: /home/vscode/.config
      - name: ingress-bridge-sidecar
        image: alpine/socat:latest
        command:
        - socat
        - "TCP-LISTEN:43635,fork,reuseaddr,bind=0.0.0.0"
        - "TCP:127.0.0.1:52424"
        {{- if .Values.sidecarResources }}
        resources:
          {{- toYaml .Values.sidecarResources | nindent 10 }}
        {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
      - name: workspace-volume
        persistentVolumeClaim:
          claimName: ws-{{ .Values.workspaceName }}-pvc
