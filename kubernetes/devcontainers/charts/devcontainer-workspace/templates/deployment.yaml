---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-{{ .Values.workspaceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: ws-{{ .Values.workspaceName }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ws-{{ .Values.workspaceName }}
  template:
    metadata:
      labels:
        app: ws-{{ .Values.workspaceName }}
    spec:
      initContainers:
      - name: init-volume-permissions
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          mkdir -p /workspaces/.persistent/keyrings /workspaces/.persistent/antigravity
          chmod -R 777 /workspaces
        volumeMounts:
        - name: workspace-volume
          mountPath: /workspaces
      containers:
      - name: workspace
        image: "{{ if .Values.image.repository }}{{ .Values.image.repository }}{{ else }}{{ .Values.global.registry }}/devcontainers/{{ .Values.git.directory }}{{ end }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        workingDir: /workspaces
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        command: ["/bin/sh", "-c"]
        args:
        - |
            if [ -x /usr/local/bin/start-antigravity ] && ! pgrep -x language_server >/dev/null 2>&1; then
              bash /usr/local/bin/start-antigravity >/tmp/start-antigravity.log 2>&1 &
            fi

            CURRENT_USER=$(whoami)
            USER_HOME=$(eval echo "~${CURRENT_USER}")
            sudo mkdir -p "${USER_HOME}/.ssh"
            sudo cp /tmp/ssh-keys/authorized_keys "${USER_HOME}/.ssh/authorized_keys" 2>/dev/null || true
            sudo chown -R "${CURRENT_USER}" "${USER_HOME}/.ssh" 2>/dev/null || true
            sudo chmod 700 "${USER_HOME}/.ssh" 2>/dev/null || true
            sudo chmod 600 "${USER_HOME}/.ssh/authorized_keys" 2>/dev/null || true

            sleep infinity
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                (
                  CURRENT_USER=$(whoami)
                  if [ ! -d /workspaces/{{ .Values.git.directory }}/.git ]; then
                    echo "Cloning primary repo..."
                    git clone {{ .Values.git.url }} /workspaces/{{ .Values.git.directory }}
                    chown -R "${CURRENT_USER}" /workspaces/{{ .Values.git.directory }} || true
                  fi
                  {{- range .Values.git.extraRepos }}
                  if [ ! -d /workspaces/{{ .directory }}/.git ]; then
                    echo "Cloning {{ .directory }}..."
                    git clone {{ .url }} /workspaces/{{ .directory }}
                    chown -R "${CURRENT_USER}" /workspaces/{{ .directory }} || true
                  fi
                  {{- end }}
                ) >/tmp/workspace-clone.log 2>&1 &
        volumeMounts:
        - name: workspace-volume
          mountPath: /workspaces
        - name: workspace-volume
          subPath: .persistent/keyrings
          mountPath: /home/vscode/.local/share/keyrings
        - name: workspace-volume
          subPath: .persistent/antigravity
          mountPath: /home/vscode/.gemini/antigravity
        - name: ssh-keys
          mountPath: /tmp/ssh-keys
          readOnly: true
      - name: ingress-bridge-sidecar
        image: alpine/socat:latest
        command:
        - socat
        - "TCP-LISTEN:43635,fork,bind=0.0.0.0,reuseaddr"
        - "TCP:127.0.0.1:52424"
        resources:
          limits:
            memory: 32Mi
            cpu: 50m
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
      - name: workspace-volume
        persistentVolumeClaim:
          claimName: ws-{{ .Values.workspaceName }}-pvc
      - name: ssh-keys
        secret:
          secretName: {{ .Values.global.sshKeySecret | quote }}
          defaultMode: 0o600
