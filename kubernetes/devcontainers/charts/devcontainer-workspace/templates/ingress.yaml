---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ws-{{ .Values.workspaceName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | default "letsencrypt" | quote }}
    coredns.io/hostname: ws-{{ .Values.workspaceName }}.{{ .Values.global.domainSuffix }}
    ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/upstream-vhost: "localhost:52425"
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx-internal" | quote }}
  tls:
  - hosts:
    - ws-{{ .Values.workspaceName }}.{{ .Values.global.domainSuffix }}
    secretName: ws-{{ .Values.workspaceName }}-tls
  rules:
  - host: ws-{{ .Values.workspaceName }}.{{ .Values.global.domainSuffix }}
    http:
      paths:
      - path: /auth/callback
        pathType: Prefix
        backend:
          service:
            name: ws-{{ .Values.workspaceName }}
            port:
              number: 41031
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ws-{{ .Values.workspaceName }}
            port:
              number: 52425
