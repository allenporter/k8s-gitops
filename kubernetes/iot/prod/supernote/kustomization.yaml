---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - release.yaml
  - backup.yaml
  - builder-cronjob.yaml
  - prometheus-rules.yaml
  - restic-config-secret.yaml
  - gemini-secret.yaml
  - zot-builder-auth-secret.yaml
configMapGenerator:
  - name: supernote-dashboard
    namespace: supernote
    files:
      - supernote-dashboard.json
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    grafana_dashboard: "1"
