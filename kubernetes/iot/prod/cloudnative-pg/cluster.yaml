---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cluster
  namespace: cloudnative-pg
spec:
  interval: 30m
  chart:
    spec:
      chart: cluster
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: postgresql.cnpg.io
              version: v1
              kind: Cluster
              name: cluster
            patch: |
              - op: add
                path: /spec/probes
                value:
                  readiness:
                    timeoutSeconds: 15
                    periodSeconds: 20
                    failureThreshold: 5
                  liveness:
                    timeoutSeconds: 15
                    periodSeconds: 20
                    failureThreshold: 5
              - op: replace
                path: /spec/backup/barmanObjectStore/s3Credentials/accessKeyId/key
                value: AWS_ACCESS_KEY_ID
              - op: replace
                path: /spec/backup/barmanObjectStore/s3Credentials/secretAccessKey/key
                value: AWS_SECRET_ACCESS_KEY
  values:
    version:
      postgresql: "16"
    cluster:
      monitoring:
        enabled: true
      storage:
        storageClass: local-hostpath
      affinity:
        topologyKey: kubernetes.io/hostname
      initdb:
        database: miniflux-db
        owner: ${MINIFLUX_PG_USER}
        secret:
          name: miniflux-secret
    backups:
      enabled: true
      provider: s3
      endpointURL: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
      retentionPolicy: 30d
      s3:
        bucket: cnpg-backup
        path: /
      secret:
        create: false
        name: cnpg-backup-bucket
      wal:
        compression: gzip
        encryption: ""
      data:
        compression: gzip
        encryption: ""
        jobs: 2
