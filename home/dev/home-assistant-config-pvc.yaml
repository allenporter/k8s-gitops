---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-storage-0
  namespace: home-assistant
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 25Gi
  accessModes:
    - ReadWriteOnce
---
# This snapshot exists so we can read the home assistant sql-lite database
# from Jupyter like https://data.home-assistant.io/
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: home-assistant-snapshot-0
  namespace: home-assistant
spec:
  volumeSnapshotClassName: csi-rbdplugin-snapclass
  source:
    persistentVolumeClaimName: home-assistant-storage-0
---
# Mount the snapshot as a PVC for jupyter
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-home-assistant-storage-0
  namespace: home-assistant
spec:
  storageClassName: rook-ceph-block
  dataSource:
    name: home-assistant-snapshot-0
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 25Gi
  accessModes:
    - ReadOnlyMany
